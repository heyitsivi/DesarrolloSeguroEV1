
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de vacaciones</title>
    <link rel="stylesheet" href="{% static 'vacaciones/solicitar_vacaciones.css' %}">
</head>
<body>
    <div class="contenedor">
        <h1>Solicitud de vacaciones</h1>

        <form method="POST">
            {% csrf_token %}

            {% if formulario.non_field_errors %}
                <div class="errores">
                    {{ formulario.non_field_errors }}
                </div>
            {% endif %}

            {% for campo in formulario %}
                <label for="{{ campo.id_for_label }}">
                    {{ campo.label }}
                </label>

                {{ campo }}

                {% if campo.errors %}
                    <div class="errores">
                        {{ campo.errors }}
                    </div>
                {% endif %}
            {% endfor %}

            <button type="submit">
                Enviar solicitud
            </button>
        </form>

        <a class="enlace" href="{% url 'mis_solicitudes' %}">
            Ver mis solicitudes
        </a>
    </div>
</body>
</html>
